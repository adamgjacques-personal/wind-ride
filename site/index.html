<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Zephyr Zoom</title>
  <meta name="description" content="When the wind is right for a ride at your spots.">
  <meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌬️</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h10a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <h1>Zephyr Zoom</h1>
    </div>
    <p class="tagline">Put the wind at your back and chase that Strava Crown!</p>
    <p id="updated" class="updated">Loading…</p>
  </header>

  <main>
    <p id="summary" class="summary" hidden></p>
    <ul id="spots" class="spots" aria-live="polite">
      <li class="card skeleton" aria-hidden="true"></li>
      <li class="card skeleton" aria-hidden="true"></li>
    </ul>
    <p id="error" class="error" hidden></p>
    <details class="info">
      <summary>Info</summary>
      <div class="legend">
        <span><i class="dot great"></i>Great</span>
        <span><i class="dot green"></i>Good</span>
        <span><i class="dot amber"></i>Marginal</span>
        <span><i class="dot red"></i>Poor</span>
        <span>🌧 Rain</span>
        <span>🌅 Dawn · ☀️ Day · 🌇 Dusk · 🌙 Dark</span>
        <p>Tap a spot for the full forecast on Windy. Forecast data from Open-Meteo.</p>
      </div>
    </details>
  </main>


  <script src="app.js" type="module"></script>
</body>
</html>
