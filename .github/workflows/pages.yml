name: Zephyr Zoom - refresh forecast and deploy

on:
  schedule:
    - cron: '17 */3 * * *'   # every 3 hours (UTC); minute offset avoids the top-of-hour rush
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # let an in-progress deploy finish rather than leaving Pages half-updated

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
      - id: pages
        uses: actions/configure-pages@v6
      # If Open-Meteo is unreachable, redeploy with the last published data so UI changes still ship.
      - name: Build forecast data
        run: |
          if ! npm run build; then
            echo "::warning::Forecast refresh failed; reusing the last published results.json"
            curl -fsSL "${{ steps.pages.outputs.base_url }}/results.json" -o site/results.json
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # Separate job (GitHub's standard Pages layout) so the artifact is visible before deploy looks for it.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
